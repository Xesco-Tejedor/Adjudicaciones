name: Actualizar adjudicaciones de España
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: adjudicaciones-es
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y filtrar adjudicaciones
        run: python3 scripts/fetch_es.py
      - name: Guardar si hay cambios
        run: |
          git config user.name "adjudicaciones-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/es.json
          git diff --cached --quiet || (git commit -m "Actualizar datos de España" && git push)
